version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # compromise drives the CLI privacy gate's entity detection. 14.19
      # drops its recall below the recorded baseline (amounts 0.80 -> 0.67,
      # test/privacy-gate/eval-gate.test.ts), so it stays pinned at ~14.16
      # until a bump passes that eval.
      - dependency-name: "compromise"
        update-types: ["version-update:semver-minor"]

  # apps/store is bun-native (its own bun.lock, excluded from the pnpm
  # workspace) -- Dependabot has no "bun" ecosystem, so an "npm" entry here
  # bumps package.json but can't regenerate bun.lock, which breaks CI on
  # every PR it opens (frozen-lockfile mismatch, e.g. #134). Removed rather
  # than pointed at an ecosystem that doesn't exist; deps here stay on
  # manual `bun update` until Dependabot ships Bun support.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
