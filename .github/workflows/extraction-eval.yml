name: Extraction eval

# Quality eval for gnt prebrain's extraction step
# (apps/cli/src/prebrain/extraction/) -- measures precision/recall against
# a seeded corpus by making real, paid Anthropic API calls (cloud mode,
# claude-haiku-4-5), so unlike ci.yml this deliberately does NOT run on
# every push/PR. GitHub Actions path filtering is workflow-level, not
# job-level, which is why this is its own workflow file instead of a job
# bolted onto ci.yml's single shared `on:` block -- it only triggers when
# the extraction module or this eval's own directory actually changes.
on:
  pull_request:
    paths:
      - "apps/cli/src/prebrain/extraction/**"
      - "apps/cli/eval/extraction/**"
      - ".github/workflows/extraction-eval.yml"
  push:
    branches: [main]
    paths:
      - "apps/cli/src/prebrain/extraction/**"
      - "apps/cli/eval/extraction/**"
      - ".github/workflows/extraction-eval.yml"
  workflow_dispatch:

concurrency:
  group: extraction-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extraction-eval:
    name: extraction eval (cloud mode, claude-haiku-4-5)
    # GitHub already returns an empty string for secrets.ANTHROPIC_API_KEY
    # on pull_request runs from forks (repo secrets are never forwarded to
    # fork PRs under plain pull_request, only pull_request_target, which
    # this workflow doesn't use), so the `env.ANTHROPIC_API_KEY != ''`
    # check below already sends every fork PR to the free skip step.
    runs-on: ubuntu-latest
    # Not a required check, but a hung run here blocks every other queued job just as badly
    # as a hung required one. See ci.yml's matching comment.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cli
    env:
      # Empty string, not unset, when the secret doesn't exist -- that's
      # what makes the `env.ANTHROPIC_API_KEY != ''` checks below work as
      # a presence check. As of this eval shipping, no such secret exists
      # in this repo's GitHub Actions secrets yet -- see README.md's "No
      # recorded cloud baseline yet" section for the manual follow-up.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # bun reads the node_modules pnpm already installed above, same as
      # ci.yml's web job -- no separate `bun install` needed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: run extraction eval against real cloud extraction
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: bun test test/prebrain/extraction/eval-gate.test.ts

      - name: skip (ANTHROPIC_API_KEY secret not configured)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "::warning::ANTHROPIC_API_KEY is not set in this repo's GitHub Actions secrets -- skipping the extraction quality eval. This is expected until a human adds the secret under Settings > Secrets and variables > Actions; it does not fail the build."
