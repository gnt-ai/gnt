name: Publish CLI to npm

# Uses npm's Trusted Publisher (OIDC) flow -- no NPM_TOKEN secret, no 2FA
# OTP prompt. npm exchanges this job's GitHub Actions OIDC identity for a
# short-lived publish credential automatically, as long as this exact
# org/repo/workflow filename is registered as a trusted publisher on the
# @gnt-ai/cli package settings page on npmjs.com.

on:
  push:
    branches: [main]
    paths:
      - apps/cli/package.json
  workflow_dispatch:

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's OIDC trusted-publisher exchange
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm's OIDC trusted-publisher support needs a recent npm CLI --
      # Node 22's bundled version predates it.
      - run: npm install -g npm@latest

      - name: Skip if this version is already published
        id: check
        working-directory: apps/cli
        run: |
          set -euo pipefail
          local_version=$(node -p "require('./package.json').version")
          if npm view "@gnt-ai/cli@$local_version" version >/dev/null 2>&1; then
            echo "Already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @gnt-ai/cli build

      # --provenance needs a public source repo for its Sigstore
      # transparency-log entry -- this repo is private, so it's omitted.
      # The OIDC trusted-publisher auth itself doesn't depend on it.
      - if: steps.check.outputs.publish == 'true'
        working-directory: apps/cli
        run: npm publish --access public
