name: Batch release (public contributions)

# Digest of whatever merged into main since the last release -- not every
# PR deserves its own release (noisy: a repo where every doc typo fix
# gets its own release entry trains people to ignore the Releases tab),
# but waiting for an unrelated future npm version bump to sweep up an
# external contribution isn't good either -- that's exactly what almost
# happened to gnt-ai/gnt#12, the project's first outside PR, before it
# got a manual one-off release instead. This is the automated middle
# ground: check every 3 days, skip silently if nothing merged since the
# last release, credit everyone by PR (via --generate-notes) if something
# did.
#
# Diffs from whichever release tag is closest to main in actual git
# history -- a real cli-vX.Y.Z npm release (see publish-cli.yml in the
# private repo) or a previous batch release, whichever a smaller
# `compare...main` ahead_by picks out -- so a PR never gets double-credited
# across both release tracks. This has to be ahead_by, not release
# publishedAt: a release's GitHub "published" timestamp reflects when the
# release object itself was created, not when its tag lands in history, so
# two releases can publish out of git order (as cli-v0.6.0 and v1.0.0 did)
# and sorting by publishedAt alone would pick the wrong anchor.
#
# Tagged vX.Y.Z, sequential starting at v1.0.0 -- separate from the
# cli-vX.Y.Z track, which has to mirror the real published npm version
# and isn't ours to renumber. This track has no such anchor, so it gets
# a normal incrementing version instead of a date stamp.
#
# Runs natively on this repo (not triggered cross-repo from the private
# one, the way publish-cli.yml's own release step has to be), so the
# default GITHUB_TOKEN with contents: write below is enough -- no
# GH_RELEASE_TOKEN-style fine-grained PAT needed here.

on:
  schedule:
    - cron: "0 9 */3 * *" # every 3 days, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the most recent release and check for new commits since it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName')
          if [ -z "$tags" ]; then
            echo "No prior release found on this repo -- nothing to diff against, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_tag=""
          least_ahead=""
          while IFS= read -r t; do
            ahead=$(gh api "repos/${{ github.repository }}/compare/$t...main" --jq '.ahead_by')
            if [ -z "$least_ahead" ] || [ "$ahead" -lt "$least_ahead" ]; then
              least_ahead=$ahead
              last_tag=$t
            fi
          done <<< "$tags"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          if [ "$least_ahead" -eq 0 ]; then
            echo "Nothing merged since $last_tag -- skipping this week."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$least_ahead commit(s) since $last_tag -- cutting a batch release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the batch release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_version=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty')
          if [ -z "$last_version" ]; then
            tag="v1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${last_version#v}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          # Title is just the tag, nothing else -- matches the convention
          # every other release on this repo uses (cli-v0.6.0's own title
          # is just "cli-v0.6.0"), and the plain "vX.Y.Z" style real
          # release feeds use. No editorializing title text.
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target main \
            --title "$tag" \
            --notes-start-tag "${{ steps.check.outputs.last_tag }}" \
            --generate-notes
