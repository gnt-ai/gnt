[project]
name = "gnt-api"
version = "0.1.0"
description = "AI GNT backend — git-native rules pipeline, skill compiler, MCP endpoint"
readme = "README.md"
authors = [
    { name = "lukaadzic", email = "maintainers@gntai.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "arq>=0.26",
    "anthropic>=0.40",
    "pgvector>=0.3",
    "mcp>=1.10",
    "groq>=1.5.0",
    "httpx>=0.28.1",
    "cryptography>=46.0.7",
    "pyyaml>=6.0",
    "sentry-sdk>=2.65.0",
    "stripe>=11.0",
    "spacy>=3.8.14",
    "en-core-web-md",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gnt"
module-root = "src"

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
