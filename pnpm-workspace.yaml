packages:
  - "apps/*"
  - "packages/*"
  # apps/store is Bun-native at the runtime level (Bun.serve, bun:test —
  # not a dependency's requirement, its own code) — managed by its own
  # `bun install`/bun.lock and its own CI job, not pnpm/turbo. Mixing a
  # bun-managed node_modules with a pnpm-linked one in the same directory
  # is a real breakage risk (different resolution algorithms, different
  # lockfile formats), not just a style preference, so it stays out of the
  # workspace's package graph rather than being force-joined.
  - "!apps/store"
allowBuilds:
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
# Specific, documented findings only, same rule .gitleaksignore's own
# header states -- never a blanket --ignore-unfixable, so a genuinely new
# advisory on anything else still fails js-audit.
auditConfig:
  ignoreGhsas:
    # react-router, high severity: pinned inside apps/docs' own zudoku
    # dependency (zudoku > react-router@7.18.1), not something any app
    # code here pulls in directly. No fixed react-router version exists
    # in zudoku's tree yet (checked directly against npm -- zudoku's own
    # latest release still pins 7.18.1), there's nothing to bump to. The
    # vulnerability itself (an RSC-mode CSRF bypass on server actions) has
    # no real attack surface here either: apps/docs ships as a static
    # Vite build with no server runtime for a CSRF bypass to act on.
    - GHSA-qwww-vcr4-c8h2
minimumReleaseAgeExclude:
  - lodash@4.17.23 || 4.17.24
  - drizzle-orm@0.45.2
  - '@hono/node-server@2.0.5'
  - postcss@8.5.23
  - sharp@0.35.3
  - fast-uri@3.1.4
  - next@16.2.11
  - valibot@1.4.2
  - brace-expansion@5.0.9
  - hono@4.12.34
overrides:
  '@hono/node-server@<2.0.5': ^2.0.5
  # 5.0.8 (the prior pin here) turned out to only fix CVE-2026-14257's
  # first reported shape -- a follow-up advisory found the same DoS
  # reachable through 5.0.8's own unbounded intermediate arrays, patched
  # in 5.0.9. Bumping the floor, not adding a second override line.
  brace-expansion@<5.0.9: ^5.0.9
  # @eslint/config-array pins minimatch@^3.1.5, whose own brace-expansion
  # usage (`require("brace-expansion")` expecting a callable default
  # export) breaks against brace-expansion@5.x's new export shape -- the
  # override above alone turns eslint into a hard crash. minimatch@10.2.5
  # is already elsewhere in this tree (typescript-eslint's chain) and
  # confirmed compatible with brace-expansion@5.x, so force the old 3.x
  # line onto that same known-good version instead of a fresh one.
  minimatch@<9: ^10.2.5
  drizzle-orm@<0.45.2: ^0.45.2
  lodash@<=4.17.23: ^4.17.24
  lodash@>=4.0.0 <=4.17.22: ^4.17.23
  lodash@>=4.0.0 <=4.17.23: ^4.17.24
  # 8.5.18 (the prior pin here) only carried GHSA-6g55-p6wh-862q's first
  # fix -- an incomplete-fix follow-up (attacker-controlled
  # sourceMappingURL still reading arbitrary .map files when `from` is
  # unset) needed 8.5.23. Same bump-the-floor reasoning as brace-expansion
  # above.
  postcss@<8.5.23: ^8.5.23
  sharp@<0.35.0: ^0.35.3
  fast-uri@<=3.1.3: ^3.1.4
  valibot@<=1.4.1: ^1.4.2
  # ReDoS in Hono's CORS middleware via Access-Control-Request-Headers.
  # Pulled in transitively via @modelcontextprotocol/sdk (apps/cli's MCP
  # tooling) -- this is plain "hono", not the already-overridden
  # "@hono/node-server".
  hono@<4.12.34: ^4.12.34
